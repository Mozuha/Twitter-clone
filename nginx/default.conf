server {
    listen 80;

    server_name localhost;

    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;

    server_name localhost;

    ssl_certificate /etc/certs/localhost.pem;
    ssl_certificate_key /etc/certs/localhost-key.pem;

    location / {
        proxy_pass http://frontend:3000; # Frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /query {
        # Allow requests only from the frontend's origin
        if ($http_origin = "https://localhost") {
            add_header 'Access-Control-Allow-Origin' $http_origin;
            add_header 'Access-Control-Allow-Credentials' 'true';
        }
        # Deny access to other origins
        if ($http_origin != "https://localhost") {
            return 403; # Forbidden
        }

        proxy_pass http://api:8080/query; # Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}